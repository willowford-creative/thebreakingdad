<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Warm paper background -->
  <rect width="32" height="32" rx="6" fill="#fbf8f3"/>
  <!-- Wax-seal disc with subtle amber outer ring + inner letterpress ring -->
  <circle cx="16" cy="16" r="12" fill="#b44141"/>
  <circle cx="16" cy="16" r="12" fill="none" stroke="#f4c97c" stroke-width="0.8" opacity="0.7"/>
  <circle cx="16" cy="16" r="9.5" fill="none" stroke="#9a3838" stroke-width="0.6"/>
  <!-- DB monogram -->
  <text x="16" y="20.2" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-weight="600"
        text-anchor="middle" fill="#fbf8f3" letter-spacing="-0.3">DB</text>
</svg>
